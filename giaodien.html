<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HMI Cloud Điều Khiển Từ Xa - AC RECOVER XUÂN THÀNH</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; text-align: center; padding: 15px; margin: 0; color: #333; }
    .main-title { color: #0056b3; font-size: 24px; font-weight: bold; margin-top: 10px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .sub-title { color: #0066cc; font-size: 24px; font-weight: bold; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; }
    .status-badge { background-color: #dc3545; color: white; padding: 12px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; display: inline-block; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-transform: uppercase; border: none; }
    .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 440px; margin: 0 auto 20px auto; box-sizing: border-box; text-align: center; }
    .card-title { font-size: 18px; font-weight: bold; color: #555; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
    .stop-btn { background-color: #dc3545; color: white; border: none; padding: 18px; width: 100%; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 6px #b21f2d; transition: all 0.1s ease; box-sizing: border-box; text-transform: uppercase; }
    .stop-btn:active { transform: translateY(4px); box-shadow: 0 2px #b21f2d; }
    .btn-subtext { font-size: 13px; color: #777; margin-top: 12px; margin-bottom: 0; line-height: 1.4; }
    .gauge-container { display: flex; justify-content: space-around; gap: 15px; margin-bottom: 15px; }
    .gauge-box { width: 48%; background: white; border-radius: 16px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
    .gauge-svg { width: 120px; height: 120px; transform: rotate(-90deg); }
    .gauge-bg { fill: none; stroke: #e1e8ed; stroke-width: 12; stroke-linecap: round; }
    .gauge-fill { fill: none; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 314; stroke-dashoffset: 314; transition: stroke-dashoffset 0.3s ease; }
    .gauge-value { font-size: 24px; font-weight: bold; margin-top: -70px; margin-bottom: 40px; }
    .weight-display { font-size: 40px; font-weight: bold; color: #17a2b8; margin: 10px 0; }
    .unit { font-size: 14px; color: #888; font-weight: normal; }
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
    .action-btn { padding: 12px; font-weight: bold; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; color: white; text-transform: uppercase; }
    .input-field { padding: 12px; font-size: 16px; width: 100%; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; text-align: center; }
  </style>
</head>
<body>
  <div class="main-title">⚙️ HỆ THỐNG ĐIỀU KHIỂN CLOUD</div>
  <div class="sub-title">& GIÁM SÁT XUÂN THÀNH</div>
  <div class="status-badge" id="trang_thai">ĐANG KẾT NỐI CLOUD...</div>

  <div class="card">
    <div class="card-title">🎮 BÀN ĐIỀU KHIỂN TRÊN 4G/WIFI</div>
    <button class="stop-btn" id="btnStop">🛑 DỪNG MÁY KHẨN CẤP TỪ XA</button>
    <p class="btn-subtext">Hệ thống truyền lệnh qua vệ tinh Google Firebase bảo mật cao</p>
  </div>

  <div class="gauge-container" style="max-width:440px; margin:0 auto 20px auto;">
    <div class="gauge-box">
      <div class="card-title">🎈 ÁP SUẤT THẤP</div>
      <svg class="gauge-svg"><circle class="gauge-bg" cx="60" cy="60" r="50"></circle><circle class="gauge-fill" id="gauge_l" cx="60" cy="60" r="50" stroke="#28a745"></circle></svg>
      <div class="gauge-value" id="val_l" style="color:#28a745">0.0</div><div class="unit">PSI</div>
    </div>
    <div class="gauge-box">
      <div class="card-title">🔥 ÁP SUẤT CAO</div>
      <svg class="gauge-svg"><circle class="gauge-bg" cx="60" cy="60" r="50"></circle><circle class="gauge-fill" id="gauge_h" cx="60" cy="60" r="50" stroke="#dc3545"></circle></svg>
      <div class="gauge-value" id="val_h" style="color:#dc3545">0.0</div><div class="unit">PSI</div>
    </div>
  </div>

  <div class="card"><div class="card-title">⚖️ TRỌNG LƯỢNG BÌNH CHỨA</div><div class="weight-display" id="trong_luong_binh">0</div><div class="unit">Gram</div></div>

  <div class="card">
    <div class="card-title">🛠️ LỆNH VẬN HÀNH XƯỞNG TỪ XA</div>
    <div class="ctrl-grid">
      <button id="btnThuHoi" class="action-btn" style="background:#ffc107; color:black;">🔄 THU HỒI</button>
      <button id="btnChanKhong" class="action-btn" style="background:#17a2b8;">💨 CHÂN KHÔNG</button>
    </div>
    <div style="display: flex; gap: 10px;">
      <input type="number" id="inputGas" class="input-field" placeholder="Nhập số...">
      <button id="btnNapGas" class="action-btn" style="background:#28a745; min-width:120px;">▶ NẠP GAS</button>
    </div>
  </div>

  <!-- TÍCH HỢP HỆ THỐNG MẠNG CLOUD FIREBASE GỐC CỦA MÁY XUÂN THÀNH -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://ac-recover-xuanthanh-default-rtdb.asia-southeast1.firebasedatabase.app" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. ĐỌC DỮ LIỆU TỪ MÁY LÊN MÀN HÌNH ĐIỆN THOẠI
    const rootRef = ref(db, '/may_test_xuanthanh');
    onValue(rootRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // Code của anh đổi sang Bar khi up mây, ở đây nhân lại 14.5038 để hiển thị đúng PSI gốc trên máy
        let psiL = (data.ap_thap || 0) * 14.5038;
        let psiH = (data.ap_cao || 0) * 14.5038;
        
        document.getElementById('val_l').innerText = psiL.toFixed(1);
        document.getElementById('val_h').innerText = psiH.toFixed(1);
        document.getElementById('trong_luong_binh').innerText = data.trong_luong_gas || 0;
        
        const statusBadge = document.getElementById('trang_thai');
        statusBadge.innerText = data.trang_thai || "MÁY ĐANG HOẠT ĐỘNG";
        if(data.trang_thai && data.trang_thai.includes("HOÂN THÀNH")) {
          statusBadge.style.backgroundColor = "#008744";
        } else if(data.trang_thai && data.trang_thai.includes("CHỜ")) {
          statusBadge.style.backgroundColor = "#6c757d";
        } else {
          statusBadge.style.backgroundColor = "#fd7e14";
        }

        let ol = 314 - (((psiL + 30) / 230) * 314); document.getElementById('gauge_l').style.strokeDashoffset = ol < 0 ? 0 : (ol > 314 ? 314 : ol);
        let oh = 314 - ((psiH / 500) * 314); document.getElementById('gauge_h').style.strokeDashoffset = oh < 0 ? 0 : (oh > 314 ? 314 : oh);
      }
    });

    // 2. BẮN LỆNH ĐIỀU KHIỂN TỪ ĐIỆN THOẠI VỀ XƯỞNG
    const cmdRef = ref(db, '/may_test_xuanthanh/lenh_web');
    document.getElementById('btnStop').onclick = () => { if(confirm("DỪNG MÁY KHẨN CẤP?")) set(cmdRef, "STOP"); };
    document.getElementById('btnThuHoi').onclick = () => { if(confirm("KÍCH HOẠT THU HỒI GAS?")) set(cmdRef, "THUHOI"); };
    document.getElementById('btnChanKhong').onclick = () => { 
      let m = document.getElementById('inputGas').value || 15;
      if(confirm("HÚT CHÂN KHÔNG " + m + " PHÚT?")) set(cmdRef, "HUTCHANKHONG:" + m);
    };
    document.getElementById('btnNapGas').onclick = () => {
      let g = document.getElementById('inputGas').value;
      if(g > 0) { if(confirm("PHÁT LỆNH NẠP " + g + " GRAM?")) set(cmdRef, "NAPGAS:" + g); }
      else alert("Vui lòng nhập số Gram cần nạp!");
    };
  </script>
</body>
</html>
